dataset: CIFAR10-DVS
input_shape: [2, 128, 128]
input_dimension: 32768
architecture: [32768, 7384, 4096, 1024, 10]
num_classes: 10
local_subset_layout: data/dataset/cifar10_<class>_<id>.aedat
attack:
  target_layer: x0
  cover_layers: [s1]
  dtype: float64

neuron:
  model: LIF
  beta: 0.90
  threshold: 1.0
  surrogate: fast_sigmoid

stage1:
  max_pool: 1000
  eps_eq: 1.0e-8
  eps_proj: 1.0e-7
  zero_col_tol: 1.0e-12
  one_atol: 1.0e-13
  one_rtol: 1.0e-10
  duplicate_decimals: 12
  selection_mode: residual
  enumeration_mode: guided

stage2:
  max_nodes: 2000000
  max_sequence_solutions: 5
